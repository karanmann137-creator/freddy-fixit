# Continuous checks for the two failure classes that build CLEANLY and break at
# runtime. Neither is caught by `vite build`: esbuild does no typechecking, so a
# module that exports nothing -- or nothing at all -- compiles happily and
# explodes inside React.lazy in front of a visitor.
#
#   typecheck   caught b1361b6 (TS2322: Property 'default' is missing), where a
#               page was truncated to 0 bytes and every client hit a white
#               screen on /client-dashboard.
#   mounts      catches fa5e2b5, where the <ContractPanel/> mounts were dropped
#               and, because the payment gate fails CLOSED, every job on the
#               platform became unpayable with no error on any surface.
#
# DELIBERATELY NOT A REQUIRED STATUS CHECK. Work ships by pushing straight to
# main from tools/ship.py, which runs both of these locally before it will push
# at all -- so the deploy path is already gated and branch protection here would
# only risk blocking the owner's single route to production. What this workflow
# adds is coverage of the pushes that DON'T come through ship.py, and a red X
# plus an email when one of them is bad.
name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Catches drift in a tree nobody has pushed to lately -- the mount guard reads
  # the whole tree, so it is meaningful even with no new commits.
  schedule:
    - cron: "40 14 * * *"
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # `npm ci` needs the lockfile to agree with package.json; it is the right
      # call here precisely because it refuses when they have drifted.
      - name: Install
        run: npm ci

      # The gate that matters. Baseline is 0 errors -- if this ever goes
      # non-zero, fix the errors rather than raising the baseline.
      - name: Typecheck
        run: npm run typecheck

      # Runs regardless of the typecheck result: a missing mount and a type
      # error are independent faults, and learning about only the first one
      # wastes a round trip.
      - name: Critical mounts
        if: always()
        run: python3 tools/check_mounts.py

      # The two style guards, added 2026-11-08. Same `if: always()` for the same
      # reason as the mounts step -- these are independent faults and the point
      # of a scheduled run is to learn about all of them in one trip.
      #
      # Both catch defects with NO runtime symptom, which is why they are worth
      # a CI step at all: a navy band rendering the light theme, a field with no
      # focus ring, the dark-mode orange painted on the off-white ground. The
      # build is clean in every one of those cases.
      - name: Theme tokens
        if: always()
        run: python3 tools/check_tokens.py

      - name: UX laws
        if: always()
        run: python3 tools/check_ux.py

      # Lint ratchet, added 2026-11-11. ESLint had 164 errors and was in no
      # gate at all; 44 were set-state-in-effect and 43 were empty catch blocks,
      # which are the stale-state and silent-failure classes. Fixing them all at
      # once is a refactor, so this only stops the number going UP. When you fix
      # errors, lower LINT_BASELINE to the new count. Never raise it.
      - name: Lint ratchet
        if: always()
        env:
          LINT_BASELINE: "162"
        run: |
          n=$(npx eslint . -f json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).reduce((a,f)=>a+f.errorCount,0)))')
          echo "eslint errors: $n (baseline $LINT_BASELINE)"
          [ "$n" -le "$LINT_BASELINE" ] || { echo "::error::lint errors rose from $LINT_BASELINE to $n"; exit 1; }
