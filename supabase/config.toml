# Edge function config, mirrored from LIVE (verified 2026-08-25 via the Supabase API).
#
# P1-1. This file previously declared exactly ONE function, notify-admin. The
# Supabase CLI defaults an undeclared function to verify_jwt = true, so anyone
# running `supabase functions deploy` would have silently flipped the gate on
# every public entry point -- stripe-webhook (Stripe cannot present a JWT, so
# every payment would stop confirming), analyze-repair, both welcome functions
# and the notification fan-out. Deploys currently go through the Supabase MCP,
# which is why nobody has been bitten yet; this closes the trap rather than
# relying on nobody ever typing that command.
#
# NOTE: verify_jwt = true is NOT authentication here. The anon key is itself a
# valid project-signed JWT and ships publicly in the JS bundle, so it satisfies
# the platform gate. Functions that must know WHO is calling check in code
# (bearer -> auth.getUser -> profiles), or redeem an x-ff-internal token.

[functions.adjust-payment]
enabled = true
verify_jwt = true

[functions.admin-alert]
enabled = true
verify_jwt = false

