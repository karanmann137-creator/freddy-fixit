<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <meta name="theme-color" content="#1a2236" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts start downloading during HTML parse, in parallel with the JS bundle.
         Every page also injects its own <link> to the same URL; those are now
         cache hits rather than the first request, so headings stop arriving one
         render late. This is the superset of every weight any page asks for
         (600 and 700 included) — one request covers the whole site.
         preconnect matters more than the link itself: it opens the TLS handshake
         to both font hosts up front instead of after the CSS is parsed.

         THIS IS THE ONLY FONT LOAD THAT REACHES EVERY PAGE. The ~39 per-page
         links are each a subset, and three of them disagree about which DM Sans
         weights to ask for (one asks for no Bebas at all). They are harmless
         only because this superset already arrived. So a face used site-wide
         belongs HERE, not in a page's own <style> block — which is why the
         display face is listed below rather than being a Home-only flourish.
         Adding it to Home alone would leave every other page's h1 falling
         back to a system sans.

         The display face is ARCHIVO, and Fraunces is deliberately GONE from
         this request. Nothing under src/ references Fraunces any more — the
         face resolves through --ff-font-display in main.tsx, so leaving it
         listed here would download a variable serif that nothing renders.
         If Fraunces ever comes back, it comes back HERE and in that token
         together; one without the other either silently falls back to Arial
         or silently pays for an unused download.

         Archivo is requested as wght@400..700 only — the wdth axis is not
         asked for because nothing sets font-stretch, and a second axis
         roughly doubles the variable file for no rendered difference. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" />

    <title>Freddy Fix It — Calgary's On-Demand Home Repair & Vehicle Service Marketplace</title>
    <meta name="description" content="Freddy Fix It connects Calgary homeowners with vetted, licensed and insured contractors. Post a job, get up to five free estimates from local pros, and choose the one you want for home repairs and vehicle maintenance." />
    <link rel="canonical" href="https://freddyfixit.ca/" />

    <!-- Open Graph / social sharing defaults (per-page values are updated client-side). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Freddy Fix It" />
    <meta property="og:title" content="Freddy Fix It — Calgary's On-Demand Home Repair Marketplace" />
    <meta property="og:description" content="Post a job, get up to five estimates from vetted Calgary contractors, and book trusted local pros for home repairs and vehicle maintenance." />
    <meta property="og:url" content="https://freddyfixit.ca/" />
    <meta property="og:image" content="https://freddyfixit.ca/favicon-180.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Freddy Fix It — Calgary's On-Demand Home Repair Marketplace" />
    <meta name="twitter:description" content="Vetted, licensed Calgary contractors. Post a job and get up to five free estimates." />

    <!-- Structured data: tells Google this is a Calgary local business + enables sitelinks search. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "LocalBusiness",
          "@id": "https://freddyfixit.ca/#business",
          "name": "Freddy Fix It",
          "description": "Calgary marketplace connecting homeowners with vetted, licensed and insured contractors for home repairs and vehicle maintenance. Post a job and get up to five free estimates.",
          "url": "https://freddyfixit.ca/",
          "email": "hello@freddyfixit.ca",
          "image": "https://freddyfixit.ca/favicon-180.png",
          "priceRange": "$$",
          "areaServed": { "@type": "City", "name": "Calgary", "addressRegion": "AB", "addressCountry": "CA" },
          "address": { "@type": "PostalAddress", "addressLocality": "Calgary", "addressRegion": "AB", "addressCountry": "CA" }
        },
        {
          "@type": "WebSite",
          "@id": "https://freddyfixit.ca/#website",
          "url": "https://freddyfixit.ca/",
          "name": "Freddy Fix It",
          "publisher": { "@id": "https://freddyfixit.ca/#business" }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
