name: Deploy check

# Runs the browser smoke test against each new Vercel deployment as soon as it
# is built, instead of once a day against production after the fact.
#
# Vercel sends a repository_dispatch event when a deployment succeeds; the URL
# of that build is in client_payload.url. The last step reports the result back
# to Vercel under the check name below.
#
# Both one-time Vercel steps are done (2026-11-12): the bypass secret exists in
# Vercel and in this repo's GitHub secrets, and this check plus the "checks"
# job are required under Settings -> Build and Deployment -> Deployment Checks.
# A production build is not put on freddyfixit.ca until both pass. If the
# bypass secret is ever rotated in Vercel, update the GitHub secret too, or
# this workflow skips and deploys wait.

on:
  repository_dispatch:
    types:
      - vercel.deployment.success

# The last step writes a commit status for Vercel to read. The default token
# cannot do that (the first real run, 2026-11-12, ran the tests and then failed
# on exactly this step with "Resource not accessible by integration").
permissions:
  contents: read
  statuses: write

concurrency:
  group: deploy-check-${{ github.event.client_payload.url }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/smoke
    env:
      DEPLOY_URL: ${{ github.event.client_payload.url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - uses: actions/checkout@v4

      # A protected build answers with a redirect to vercel.com/login. Testing
      # that page would fail for a reason that has nothing to do with the site,
      # so find out first and skip cleanly.
      - name: Can the build be reached?
        id: reach
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            ${VERCEL_AUTOMATION_BYPASS_SECRET:+-H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET"} \
            "$DEPLOY_URL/")
          echo "HTTP $code from $DEPLOY_URL"
          if [ "$code" = "200" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Skipped: $DEPLOY_URL answered HTTP $code, so it is behind Vercel's login. Add the VERCEL_AUTOMATION_BYPASS_SECRET secret (see the top of deploy-check.yml)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v4
        if: steps.reach.outputs.ok == 'true'
        with:
          node-version: "20"

      - name: Install Playwright
        if: steps.reach.outputs.ok == 'true'
        run: npm install && npx playwright install --with-deps chromium

      - name: Run smoke test against this build
        if: steps.reach.outputs.ok == 'true'
        env:
          FF_SMOKE_BASE_URL: ${{ github.event.client_payload.url }}
          FF_SMOKE_EMAIL: ${{ secrets.FF_SMOKE_EMAIL }}
          FF_SMOKE_PASSWORD: ${{ secrets.FF_SMOKE_PASSWORD }}
        run: npm run smoke

      - name: Upload report
        if: always() && steps.reach.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: deploy-check-report
          path: |
            tests/smoke/playwright-report/
            tests/smoke/smoke-results.json
          retention-days: 7
          if-no-files-found: ignore

      # Reports this job's result to Vercel. Not sent when the run was skipped,
      # so a skip can never be read as a pass.
      - name: Notify Vercel
        if: always() && steps.reach.outputs.ok == 'true'
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          # Vercel only lists a check as "configured" when its name follows this
          # pattern ("Vercel - <project>: <check>"); plain "Smoke test" was reported
          # but could not be selected in Settings -> Deployment Checks.
          name: "Vercel - freddy-fixit: smoke-test"
